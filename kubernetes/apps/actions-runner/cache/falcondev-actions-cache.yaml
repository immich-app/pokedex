---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actions-cache
  namespace: actions-cache
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/falcondev-oss/github-actions-cache-server
              tag: 9.7.0@sha256:3999b0202ec509f3b2084ef92cc50b408838e0d442b5997dd6dff2d89f4fe7b4
            env:
              API_BASE_URL: "http://actions-cache.actions-cache.svc.cluster.local:3000"
              STORAGE_FILESYSTEM_PATH: "/data/cache"
              DB_SQLITE_PATH: "/data/sqlite.db"
    service:
      main:
        ports:
          http:
            port: 3000
    persistence:
      data:
        enabled: true
        storageClass: ceph-block
        size: 250Gi
        accessMode: ReadWriteOnce
