---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actions-cache
  namespace: actions-cache
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/falcondev-oss/github-actions-cache-server
              tag: 10.0.0@sha256:05c4d9e7169f525f2b74d412c4a081aeec5446a017ec88bae668e63ebfb16aa9
            env:
              API_BASE_URL: "http://actions-cache.actions-cache.svc.cluster.local:3000"
              STORAGE_FILESYSTEM_PATH: "/data/cache"
              DB_SQLITE_PATH: "/data/sqlite.db"
    defaultPodOptions:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: feature.node.kubernetes.io/network-speed
                    operator: Gt
                    values: ["9999"]
    service:
      main:
        ports:
          http:
            port: 3000
    persistence:
      data:
        enabled: true
        storageClass: ceph-block
        size: 250Gi
        accessMode: ReadWriteOnce
