---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actions-cache
  namespace: actions-cache
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/falcondev-oss/github-actions-cache-server
              tag: 9.8.0@sha256:58bc6ae6fc34606c3b139e259c3c12d9ff23c793a666e8a784f13f6bb9b1aa41
            env:
              API_BASE_URL: "http://actions-cache.actions-cache.svc.cluster.local:3000"
              STORAGE_FILESYSTEM_PATH: "/data/cache"
              DB_SQLITE_PATH: "/data/sqlite.db"
    service:
      main:
        ports:
          http:
            port: 3000
    persistence:
      data:
        enabled: true
        storageClass: ceph-block
        size: 250Gi
        accessMode: ReadWriteOnce
