---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: registry
  namespace: actions-cache
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: registry
              tag: 3.1.2@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
            env:
              REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /data
              REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
              REGISTRY_PROXY_TTL: "0"
              # TODO: Docker hub creds
    service:
      main:
        ports:
          http:
            port: 5000
    persistence:
      data:
        enabled: true
        storageClass: ceph-block
        size: 100Gi
        accessMode: ReadWriteOnce
