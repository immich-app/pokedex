---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: registry
  namespace: actions-cache
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: registry
              tag: 3.1.1@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
            env:
              REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /data
              REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
              REGISTRY_PROXY_TTL: "0"
              # TODO: Docker hub creds
    service:
      main:
        ports:
          http:
            port: 5000
    persistence:
      data:
        enabled: true
        storageClass: ceph-block
        size: 100Gi
        accessMode: ReadWriteOnce
