---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hf-cache
  namespace: actions-cache
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/bo0tzz/olah
              tag: sha-71dc682@sha256:9292108b73453a043882ccae6c963c61976c032c2b3d5b9f72aac7570b5e9b51
            args:
              - --host=0.0.0.0
              - --mirror-netloc=hf-cache.actions-cache.svc.cluster.local:8090
              - --mirror-lfs-netloc=hf-cache.actions-cache.svc.cluster.local:8090
              - --repos-path=/data/repos
              - --cache-size-limit=600GB
    service:
      main:
        ports:
          http:
            port: 8090
    persistence:
      data:
        enabled: true
        storageClass: ceph-block
        size: 640Gi
        accessMode: ReadWriteOnce
