---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hf-cache
  namespace: actions-cache
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: docker.io/xiahan2019/olah
              tag: 0.5.1@sha256:a5fec886e874ca978a8b011a231337a3d7c8da9ae8a6c283ba2030bf5d259a6b
            args:
              - --host=0.0.0.0
              - --mirror-netloc=hf-cache.actions-cache.svc.cluster.local:8090
              - --mirror-lfs-netloc=hf-cache.actions-cache.svc.cluster.local:8090
              - --repos-path=/data/repos
              - --cache-size-limit=600GB
    service:
      main:
        ports:
          http:
            port: 8090
    persistence:
      data:
        enabled: true
        storageClass: ceph-block
        size: 640Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /data/repos
