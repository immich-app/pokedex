---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hf-cache
  namespace: actions-cache
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      main:
        replicas: 2
        strategy: RollingUpdate
        podDisruptionBudget:
          maxUnavailable: 1
        containers:
          main:
            image:
              repository: docker.io/xiahan2019/olah
              tag: 0.5.2@sha256:143873776b9d41955763c0ef02e589949ab16b793aebdcde209317262da185cf
            args:
              - --host=0.0.0.0
              - --mirror-netloc=hf-cache.actions-cache.svc.cluster.local:8090
              - --mirror-lfs-netloc=hf-cache.actions-cache.svc.cluster.local:8090
              - --repos-path=/data/repos
              - --cache-size-limit=600GB
            probes:
              readiness:
                enabled: true
    defaultPodOptions:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hf-cache
    service:
      main:
        ports:
          http:
            port: 8090
    persistence:
      data:
        enabled: true
        storageClass: ceph-filesystem
        size: 640Gi
        accessMode: ReadWriteMany
        globalMounts:
          - path: /data/repos
