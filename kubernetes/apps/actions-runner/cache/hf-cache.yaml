---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hf-cache
  namespace: actions-cache
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/bo0tzz/olah
              tag: sha-b783d8e@sha256:59bed5cda875b07b42c9c9d15c7c9ffd5d2a3885b140cfdc2d12e5c840a718a9
            args:
              - --host=0.0.0.0
              - --mirror-netloc=hf-cache.actions-cache.svc.cluster.local:8090
              - --mirror-lfs-netloc=hf-cache.actions-cache.svc.cluster.local:8090
              - --repos-path=/data/repos
              - --cache-size-limit=600GB
    service:
      main:
        ports:
          http:
            port: 8090
    persistence:
      data:
        enabled: true
        storageClass: ceph-block
        size: 640Gi
        accessMode: ReadWriteOnce
