---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-resource-driver
spec:
  chartRef:
    kind: OCIRepository
    name: intel-gpu-resource-driver
  interval: 1h
  values:
    kubeletPlugin:
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_8086.present: "true"
    # Talos /etc is read-only; use /run/cdi (writable, and the only dir containerd
    # scans by default) so no containerd cdi_spec_dirs patch is needed.
    cdi:
      staticPath: /run/cdi
      dynamicPath: /run/cdi
