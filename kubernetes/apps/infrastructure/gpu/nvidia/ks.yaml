apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nvidia-dra-driver-gpu
spec:
  interval: 1h
  path: ./kubernetes/apps/infrastructure/gpu/nvidia/app
  prune: true
  targetNamespace: gpu
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: nvidia-dra-driver-gpu
      namespace: gpu
  wait: true
