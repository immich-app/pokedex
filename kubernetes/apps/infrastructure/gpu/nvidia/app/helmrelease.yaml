---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-dra-driver-gpu
spec:
  interval: 1h
  chart:
    spec:
      chart: nvidia-dra-driver-gpu
      version: 25.12.0
      sourceRef:
        kind: HelmRepository
        name: nvidia-dra-driver-gpu
  values:
    nvidiaDriverRoot: /usr/local
    gpuResourcesEnabledOverride: true
    resources:
      computeDomains:
        enabled: false
    kubeletPlugin:
      # Chart default targets the vendor-only NFD label (pci-10de); our NFD emits
      # the class+vendor form, so match that instead.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-0300_10de.present
                    operator: In
                    values:
                      - "true"
