apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gpu-rebar
spec:
  interval: 1h
  path: ./kubernetes/apps/infrastructure/gpu/rebar/app
  prune: true
  targetNamespace: gpu
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
