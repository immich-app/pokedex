---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-rebar
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-rebar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-rebar
    spec:
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_8086.present: "true"
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: rebar
          image: docker.io/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
          command: ["python3", "-u", "/scripts/rebar.py"]
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: claims
              mountPath: /var/lib/kubelet/plugins/gpu.intel.com
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: gpu-rebar
        - name: claims
          hostPath:
            path: /var/lib/kubelet/plugins/gpu.intel.com
            type: DirectoryOrCreate
