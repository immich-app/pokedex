apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: igpu-intel-jasperlake
spec:
  selectors:
    - cel:
        expression: device.driver == 'gpu.intel.com' && device.attributes['gpu.intel.com'].pciId == '0x4e61'
