apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: public-vip
spec:
  blocks:
    - cidr: 10.10.10.10/32
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: public-vip
spec:
  loadBalancerIPs: true
  # The announcer receives all VIP traffic (externalTrafficPolicy: Cluster).
  nodeSelector:
    matchLabels:
      feature.node.kubernetes.io/network-fast: "true"
