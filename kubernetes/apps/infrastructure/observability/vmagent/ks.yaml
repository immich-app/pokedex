---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vmagent-secrets
spec:
  interval: 1h
  path: ./kubernetes/apps/infrastructure/observability/vmagent/secrets
  prune: true
  targetNamespace: observability
  dependsOn:
    - name: external-secrets-stores
      namespace: secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vmagent
spec:
  interval: 1h
  path: ./kubernetes/apps/infrastructure/observability/vmagent/app
  prune: true
  targetNamespace: observability
  dependsOn:
    - name: vmagent-secrets
    - name: rook-ceph-cluster
      namespace: storage
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: vmagent
      namespace: observability
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vmagent-scrapes
spec:
  interval: 1h
  path: ./kubernetes/apps/infrastructure/observability/vmagent/scrapes
  prune: true
  targetNamespace: observability
  dependsOn:
    - name: vmagent
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
