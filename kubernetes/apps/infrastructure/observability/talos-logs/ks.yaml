---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: talos-logs
spec:
  interval: 1h
  path: ./kubernetes/apps/infrastructure/observability/talos-logs/app
  prune: true
  targetNamespace: observability
  dependsOn:
    - name: vmagent-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: talos-logs
      namespace: observability
  wait: true
