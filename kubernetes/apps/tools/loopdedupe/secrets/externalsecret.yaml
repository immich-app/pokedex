---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loopdedupe-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1p-tf
  refreshInterval: "30m"
  target:
    name: loopdedupe-secrets
  data:
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: LOOPDEDUPE_SECRET_KEY_BASE
    - secretKey: VOYAGE_API_KEY
      remoteRef:
        key: LOOPDEDUPE_VOYAGE_API_KEY
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: GITHUB_APP_IMMICH_READ_ONLY
        property: app_id
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef:
        key: GITHUB_APP_IMMICH_READ_ONLY
        property: installation_id
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: GITHUB_APP_IMMICH_READ_ONLY
        property: pkcs8
