---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app loopdedupe-secrets
  namespace: tools
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-stores
      namespace: secrets
  path: ./kubernetes/apps/tools/loopdedupe/secrets
  prune: true
  targetNamespace: tools
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app loopdedupe-database
  namespace: tools
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cloudnative-pg
      namespace: cnpg-system
  path: ./kubernetes/apps/tools/loopdedupe/database
  prune: true
  targetNamespace: tools
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: loopdedupe
      namespace: tools
  interval: 1h
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app loopdedupe
  namespace: tools
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: loopdedupe-secrets
    - name: loopdedupe-database
    - name: envoy-gateway-config
      namespace: network
    - name: cert-manager-issuers
      namespace: cert-manager
  path: ./kubernetes/apps/tools/loopdedupe/app
  prune: true
  targetNamespace: tools
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  wait: true
