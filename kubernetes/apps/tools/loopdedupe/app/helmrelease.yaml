---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loopdedupe
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      loopdedupe:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/bo0tzz/loopdedupe
              tag: 0.0.12@sha256:6f7672f9f82482c4b44cac78fce69926f7e0263feca6a8c27f271a362abe12ca
            env:
              ENVIRONMENT: production
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: loopdedupe-app
                    key: uri
            envFrom:
              - secretRef:
                  name: loopdedupe-secrets
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
    service:
      app:
        controller: loopdedupe
        ports:
          http:
            port: 8000
