---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loopdedupe
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      loopdedupe:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/bo0tzz/loopdedupe
              tag: 0.0.6@sha256:63f8af85e5b40b6a2a20fa86b8db9d6f1813717e50d94dcc57da1ec1500266a4
            env:
              ENVIRONMENT: production
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: loopdedupe-app
                    key: uri
            envFrom:
              - secretRef:
                  name: loopdedupe-secrets
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
    service:
      app:
        controller: loopdedupe
        ports:
          http:
            port: 8000
