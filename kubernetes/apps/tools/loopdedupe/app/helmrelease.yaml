---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loopdedupe
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      loopdedupe:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/bo0tzz/loopdedupe
              tag: 0.0.5@sha256:d7bf6f12546f88aead1c016f1b1932e86156e979a5b25c4cd05ded878a0a30f6
            env:
              ENVIRONMENT: production
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: loopdedupe-app
                    key: uri
            envFrom:
              - secretRef:
                  name: loopdedupe-secrets
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
    service:
      app:
        controller: loopdedupe
        ports:
          http:
            port: 8000
