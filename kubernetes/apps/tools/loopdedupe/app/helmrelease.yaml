---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loopdedupe
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      loopdedupe:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/bo0tzz/loopdedupe
              tag: 0.0.11@sha256:522babe7a15fc728be1e7fef1118a1425d4bc8650d052b969f9740cabed4fb95
            env:
              ENVIRONMENT: production
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: loopdedupe-app
                    key: uri
            envFrom:
              - secretRef:
                  name: loopdedupe-secrets
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
    service:
      app:
        controller: loopdedupe
        ports:
          http:
            port: 8000
