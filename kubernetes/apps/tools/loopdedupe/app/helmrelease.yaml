---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loopdedupe
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      loopdedupe:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/bo0tzz/loopdedupe
              tag: 0.0.10@sha256:d97c508b083152af351c2700a4b4e55d2e9bc22c24b84196cd8abda567b00b10
            env:
              ENVIRONMENT: production
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: loopdedupe-app
                    key: uri
            envFrom:
              - secretRef:
                  name: loopdedupe-secrets
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
    service:
      app:
        controller: loopdedupe
        ports:
          http:
            port: 8000
