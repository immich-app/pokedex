---
version: v1alpha1
debug: false
persist: true
machine:
  features:
    diskQuotaSupport: true
  # Talos's service logs (machined, kubelet, etcd, containerd...) to the
  # talos-logs relay on loopback (kubernetes/apps/infrastructure/observability/
  # talos-logs), which ships them to o11y. Kernel logs: KmsgLogConfig below.
  logging:
    destinations:
      - endpoint: tcp://127.0.0.1:6050/
        format: json_lines
---
apiVersion: v1alpha1
kind: KubeClusterConfig
clusterName: pokedex
endpoint: https://kube.pokedex.internal.immich.cloud:6443
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
dnsDomain: cluster.local
podSubnets:
  - 10.244.0.0/16
serviceSubnets:
  - 10.96.0.0/12
---
apiVersion: v1alpha1
kind: DiscoveryServiceConfig
name: default
endpoint: https://discovery.talos.dev/
---
apiVersion: v1alpha1
kind: ResolverConfig
hostDNS:
  enabled: true
  forwardKubeDNSToHost: true
---
apiVersion: v1alpha1
kind: KubePrismConfig
port: 7445
---
apiVersion: v1alpha1
kind: KubeletConfig
image: ghcr.io/siderolabs/kubelet:v1.37.0
defaultRuntimeSeccompProfileEnabled: true
---
# The kernel ring buffer (OOM kills, link and disk errors) to the same relay.
# Talos reads it from the start and holds delivery until the relay accepts, so
# boot messages arrive once it is up.
apiVersion: v1alpha1
kind: KmsgLogConfig
name: talos-logs
url: tcp://127.0.0.1:6051/
