---
version: v1alpha1
debug: false
persist: true
machine:
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.36.1
    defaultRuntimeSeccompProfileEnabled: true
    disableManifestsDirectory: true
  install:
    wipe: false
    grubUseUKICmdline: true
  features:
    diskQuotaSupport: true
    kubePrism:
      enabled: true
      port: 7445
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
cluster:
  controlPlane:
    endpoint: https://kube.pokedex.internal.immich.cloud:6443
  clusterName: pokedex
  network:
    cni:
      name: none
    dnsDomain: cluster.local
    podSubnets:
      - 10.244.0.0/16
    serviceSubnets:
      - 10.96.0.0/12
  discovery:
    enabled: true
    registries:
      kubernetes:
        disabled: true
      service: {}
